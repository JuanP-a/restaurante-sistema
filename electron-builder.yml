appId: com.juanpa.restaurante
productName: Sistema de Pedidos
directories:
  output: dist
files:
  - dist-electron/**
  - package.json
extraResources:
  - from: dist-standalone
    to: standalone
    filter:
      - "**/*"
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
